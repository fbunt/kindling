<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>kindling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="login-view" class="view d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 text-center" style="max-width: 400px; width: 100%;">
            <h1 class="mb-2"><img src="/favicon.svg" alt="" style="height: 1em; vertical-align: -0.1em;"> kindling</h1>
            <p class="text-secondary mb-4">Enter your Google Gemini API key to get started.</p>
            <form id="login-form">
                <div class="mb-3">
                    <input type="password" id="api-key-input" class="form-control" placeholder="Gemini API key" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary w-100">Connect</button>
            </form>
            <div id="login-error" class="text-danger mt-3 small" hidden></div>
        </div>
    </div>

    <div id="chat-view" class="view d-flex flex-column vh-100" hidden>
        <nav class="navbar border-bottom px-3">
            <span class="navbar-brand mb-0 h1"><img src="/favicon.svg" alt="" style="height: 1em; vertical-align: -0.1em;"> kindling</span>
            <div class="d-flex align-items-center gap-2">
                <span id="model-label" class="badge bg-secondary text-light fw-normal" style="font-size: 0.8rem;">gemini-3.1-pro-preview</span>
                <button id="download-btn" class="btn btn-outline-secondary btn-sm" title="Download chat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
                <button id="clear-btn" class="btn btn-outline-secondary btn-sm" title="New chat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
                </button>
                <button id="logout-btn" class="btn btn-outline-secondary btn-sm">Logout</button>
            </div>
        </nav>
        <div class="chat-body d-flex flex-grow-1 overflow-hidden">
            <div class="chat-main d-flex flex-column flex-grow-1">
                <div id="messages" class="flex-grow-1 overflow-auto p-3 d-flex flex-column gap-2 mx-auto w-100" style="max-width: 1275px;"></div>
                <form id="chat-form" class="p-3 border-top mx-auto w-100" style="max-width: 1275px;">
                    <div class="input-wrapper position-relative">
                        <textarea id="chat-input" class="form-control" placeholder="Type a message..." rows="3" required></textarea>
                        <span id="image-name" class="image-name" hidden></span>
                        <div class="input-toolbar">
                            <label id="image-upload-label" class="image-upload-label" title="Attach image">
                                <input type="file" id="image-input" accept="image/png,image/jpeg" hidden>
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            </label>
                            <button type="submit" id="send-btn" class="btn btn-primary btn-sm send-btn-label">Send <kbd>Ctrl</kbd> <kbd>↵</kbd></button>
                        </div>
                    </div>
                </form>
            </div>
            <div id="gallery-panel" class="gallery-panel border-start" hidden>
                <div class="gallery-header px-3 py-2 border-bottom d-flex align-items-center">
                    <strong>Plots</strong>
                </div>
                <div id="gallery-list" class="gallery-list overflow-auto p-2 d-flex flex-column gap-2"></div>
            </div>
        </div>
    </div>

    <div id="lightbox" class="lightbox" hidden>
        <img id="lightbox-img" src="" alt="">
    </div>

    <div class="modal fade" id="clear-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Start new chat?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Your current chat and any work in progress will be lost.</p>
                    <p class="text-secondary small mb-0">You can save the current chat first using the download button.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-sm" id="clear-confirm-btn">Clear chat</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/languages/python.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
