[project]
name = "kindling"
version = "0.1.0"
description = "A natural language query tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "google-genai",
    "itsdangerous",
    "python-dotenv",
    "python-multipart",
    "polars>=1.38.1",
    "matplotlib",
    "seaborn",
    "pyarrow",
]

[project.scripts]
kindling = "app.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "model_eval: model-behavior eval test (skipped unless --run-evals is passed)",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"app/tools.py" = ["E501"]  # long strings in SYSTEM_INSTRUCTION and tool descriptions

[tool.ruff.format]
quote-style = "double"
