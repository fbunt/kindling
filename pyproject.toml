[project]
name = "natlangq"
version = "0.1.0"
description = "A natural language query tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "google-genai",
    "itsdangerous",
    "python-dotenv",
    "python-multipart",
    "polars>=1.38.1",
    "matplotlib",
    "seaborn",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"app/tools.py" = ["E501"]  # long strings in SYSTEM_INSTRUCTION and tool descriptions

[tool.ruff.format]
quote-style = "double"
