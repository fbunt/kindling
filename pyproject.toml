[project]
name = "kindling"
version = "0.1.0"
description = "A natural language query tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "google-genai",
    "itsdangerous",
    "python-dotenv",
    "python-multipart",
    "polars>=1.38.1",
    "pyarrow",
]

# Plotting/analysis libs are used ONLY inside the worker container (the host/app
# server never imports them). The worker image installs pinned versions directly
# (see Containerfile); this group is for a full local dev env if wanted.
[project.optional-dependencies]
worker = [
    "matplotlib",
    "seaborn",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "tabulate",
]

[project.scripts]
kindling = "app.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "model_eval: model-behavior eval test (skipped unless --run-evals is passed)",
]
filterwarnings = [
    # Benign asyncio/pytest teardown artifact: subprocess transports (worker procs
    # and the short-lived `podman` helper procs) GC'd after a per-test event loop
    # closes, surfacing as "Event loop is closed" unraisables. Worker.kill closes
    # its transport and drain() awaits in-flight refills to minimize these; this
    # backstops residual GC-timing noise from the helper subprocesses.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"app/tools.py" = ["E501"]  # long strings in SYSTEM_INSTRUCTION and tool descriptions

[tool.ruff.format]
quote-style = "double"
